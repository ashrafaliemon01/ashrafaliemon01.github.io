DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ashraf ali emon.com</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

/* Header */
.header{
    text-align:center;
    padding:15px 10px;
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid #222;
}

/* Menu */
.menu{
    position:absolute;
    top:15px;
    right:20px;
    font-size:32px;
    cursor:pointer;
}

.menu-box{
    display:none;
    position:absolute;
    right:10px;
    top:55px;
    background:#151515;
    border:1px solid #444;
    border-radius:10px;
    width:180px;
    z-index:100;
}

.menu-box div{
    padding:15px;
    border-bottom:1px solid #333;
    cursor:pointer;
}

.menu-box div:hover{
    background:#292929;
}

/* Profile */
.profile{
    text-align:center;
    padding:25px 0 10px;
}

.avatar{
    width:140px;
    height:140px;
    background:red;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    font-weight:bold;
}

/* Main */
.container{
    width:95%;
    max-width:500px;
    margin:20px auto;
}

/* Tabs */
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.tab{
    flex:1;
    padding:13px;
    background:#191919;
    border:1px solid #444;
    color:white;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

.tab.active{
    background:#333;
}

/* Sections */
.section{
    display:none;
}

.section.active{
    display:block;
}

/* Calculator */
.calculator{
    background:#111;
    padding:15px;
    border-radius:15px;
    border:1px solid #333;
}

.display{
    width:100%;
    height:70px;
    background:#000;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    font-size:30px;
    text-align:right;
    padding:10px;
    margin-bottom:12px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.buttons button{
    height:60px;
    border:none;
    border-radius:10px;
    background:#292929;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.buttons button:active{
    background:#555;
}

.operator{
    background:#ff3b30 !important;
}

.equal{
    background:#1683ff !important;
}

.clear{
    background:#555 !important;
}

/* History */
.history{
    margin-top:20px;
    background:#111;
    padding:15px;
    border-radius:12px;
}

.history h3{
    margin-top:0;
}

.history-item{
    padding:10px;
    border-bottom:1px solid #333;
    text-align:left;
}

.delete-history{
    float:right;
    background:#d00;
    color:white;
    border:0;
    padding:5px 8px;
    border-radius:5px;
}

/* Notes */
.note-input{
    width:100%;
    background:#111;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    font-size:16px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

.save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#1683ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.notes-list{
    margin-top:20px;
}

.note{
    background:#151515;
    border:1px solid #333;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
    text-align:left;
}

.note h3{
    margin-top:0;
}

.note-buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.note-buttons button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
}

.edit{
    background:#1683ff;
}

.delete{
    background:#d00000;
}

/* Footer */
.footer{
    text-align:center;
    color:#777;
    padding:30px 10px;
}
</style>
</head>

<body>

<div class="header">
    ashraf ali emon.com
</div>

<div class="menu" onclick="toggleMenu()">☰</div>

<div class="menu-box" id="menuBox">
    <div onclick="showSection('calculator')">🧮 Calculator</div>
    <div onclick="showSection('notes')">📝 Notes</div>
    <div onclick="showSection('history')">📜 History</div>
</div>

<div class="profile">
    <div class="avatar">A</div>
</div>

<div class="container">

    <div class="tabs">
        <button class="tab active" onclick="showSection('calculator')">
            🧮 Calculator
        </button>

        <button class="tab" onclick="showSection('notes')">
            📝 Notes
        </button>
    </div>

    <!-- Calculator -->
    <div id="calculator" class="section active">

        <div class="calculator">

            <input
                type="text"
                id="display"
                class="display"
                value=""
                readonly
            >

            <div class="buttons">

                <button class="clear" onclick="clearDisplay()">C</button>
                <button onclick="backspace()">⌫</button>
                <button onclick="addValue('%')">%</button>
                <button class="operator" onclick="addValue('/')">÷</button>

                <button onclick="addValue('7')">7</button>
                <button onclick="addValue('8')">8</button>
                <button onclick="addValue('9')">9</button>
                <button class="operator" onclick="addValue('*')">×</button>

                <button onclick="addValue('4')">4</button>
                <button onclick="addValue('5')">5</button>
                <button onclick="addValue('6')">6</button>
                <button class="operator" onclick="addValue('-')">−</button>

                <button onclick="addValue('1')">1</button>
                <button onclick="addValue('2')">2</button>
                <button onclick="addValue('3')">3</button>
                <button class="operator" onclick="addValue('+')">+</button>

                <button onclick="addValue('0')">0</button>
                <button onclick="addValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
                <button class="clear" onclick="clearDisplay()">AC</button>

            </div>
        </div>

        <div class="history">
            <h3>📜 হিসাবের History</h3>
            <div id="historyList"></div>
        </div>

    </div>


    <!-- Notes -->
    <div id="notes" class="section">

        <input
            type="text"
            id="noteTitle"
            class="note-input"
            placeholder="নোটের শিরোনাম"
        >

        <textarea
            id="noteText"
            class="note-input"
            placeholder="এখানে আপনার নোট লিখুন..."
        ></textarea>

        <button class="save-btn" onclick="saveNote()">
            💾 নোট Save করুন
        </button>

        <div class="notes-list" id="notesList"></div>

    </div>

</div>

<div class="footer">
    © 2026 ashraf ali emon.com
</div>


<script>

/* =========================
   MENU
========================= */

function toggleMenu(){
    const menu = document.getElementById("menuBox");

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }else{
        menu.style.display = "block";
    }
}


/* =========================
   SECTION
========================= */

function showSection(section){

    document.querySelectorAll(".section").forEach(function(el){
        el.classList.remove("active");
    });

    document.getElementById(section).classList.add("active");

    document.getElementById("menuBox").style.display="none";

    document.querySelectorAll(".tab").forEach(function(el){
        el.classList.remove("active");
    });

    if(section === "calculator"){
        document.querySelectorAll(".tab")[0].classList.add("active");
    }

    if(section === "notes"){
        document.querySelectorAll(".tab")[1].classList.add("active");
    }
}


/* =========================
   CALCULATOR
========================= */

let display = document.getElementById("display");

function addValue(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function backspace(){
    display.value = display.value.slice(0,-1);
}

function calculate(){

    if(display.value === ""){
        return;
    }

    try{

        let expression = display.value;

        let result = Function(
            '"use strict";return (' + expression + ')'
        )();

        if(!isFinite(result)){
            throw new Error();
        }

        result = Number(result.toFixed(10));

        saveHistory(expression, result);

        display.value = result;

        loadHistory();

    }catch(error){

        display.value = "Error";

        setTimeout(function(){
            display.value = "";
        },1000);
    }
}


/* =========================
   CALCULATOR HISTORY
========================= */

function saveHistory(expression,result){

    let history =
        JSON.parse(localStorage.getItem("calculatorHistory")) || [];

    history.unshift({
        expression:expression,
        result:result,
        date:new Date().toLocaleString("bn-BD")
    });

    localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
    );
}


function loadHistory(){

    let history =
        JSON.parse(localStorage.getItem("calculatorHistory")) || [];

    let list = document.getElementById("historyList");

    list.innerHTML="";

    if(history.length === 0){

        list.innerHTML =
            "<p style='color:#777'>এখনও কোনো হিসাব নেই।</p>";

        return;
    }

    history.forEach(function(item,index){

        let div = document.createElement("div");

        div.className="history-item";

        div.innerHTML = `
            <b>${item.expression} = ${item.result}</b>
            <br>
            <small>${item.date}</small>
            <button
                class="delete-history"
                onclick="deleteHistory(${index})">
                ×
            </button>
        `;

        list.appendChild(div);

    });
}


function deleteHistory(index){

    let history =
        JSON.parse(localStorage.getItem("calculatorHistory")) || [];

    history.splice(index,1);

    localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
    );

    loadHistory();
}


/* =========================
   NOTES
========================= */

let editingNote = -1;

function saveNote(){

    let title =
        document.getElementById("noteTitle").value.trim();

    let text =
        document.getElementById("noteText").value.trim();

    if(title === "" && text === ""){
        alert("দয়া করে একটি নোট লিখুন।");
        return;
    }

    let notes =
        JSON.parse(localStorage.getItem("notes")) || [];

    if(editingNote === -1){

        notes.unshift({
            title:title || "নতুন নোট",
            text:text,
            date:new Date().toLocaleString("bn-BD")
        });

    }else{

        notes[editingNote].title =
            title || "নতুন নোট";

        notes[editingNote].text = text;

        notes[editingNote].date =
            new Date().toLocaleString("bn-BD");

        editingNote = -1;
    }

    localStorage.setItem(
        "notes",
        JSON.stringify(notes)
    );

    document.getElementById("noteTitle").value="";
    document.getElementById("noteText").value="";

    document.querySelector(".save-btn").innerText =
        "💾 নোট Save করুন";

    loadNotes();
}


function loadNotes(){

    let notes =
        JSON.parse(localStorage.getItem("notes")) || [];

    let list =
        document.getElementById("notesList");

    list.innerHTML="";

    if(notes.length === 0){

        list.innerHTML =
            "<p style='color:#777'>এখনও কোনো নোট নেই।</p>";

        return;
    }

    notes.forEach(function(note,index){

        let div =
            document.createElement("div");

        div.className="note";

        div.innerHTML = `
            <h3>📝 ${escapeHTML(note.title)}</h3>

            <div>
                ${escapeHTML(note.text).replace(/\n/g,"<br>")}
            </div>

            <small style="color:#777">
                ${note.date}
            </small>

            <div class="note-buttons">

                <button
                    class="edit"
                    onclick="editNote(${index})">
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteNote(${index})">
                    🗑️ Delete
                </button>

            </div>
        `;

        list.appendChild(div);
    });
}
